<!DOCTYPE html>
<html lang="en-IN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BizPulse Voice Express | Download on Mobile</title>
<meta name="theme-color" content="#08172f">
<style>body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #08172f; color: #e9f0f9; font-family: "Segoe UI", system-ui, sans-serif; } .demo { text-align: center; padding: 24px; } .demo h1 { color: #d8b25a; font-weight: 600; }</style>
</head>
<body>
<main class="demo">
<h1>BizPulse Voice Express</h1>
<p>Billing by voice on your Android phone.</p>

<section class="bp-vx" id="bp-vx-download" aria-label="Download BizPulse Voice Express on your phone">

  <dialog class="bp-vx-dialog" aria-labelledby="bp-vx-title">
    <div class="bp-vx-head"><h3 id="bp-vx-title">Download Voice Express on Mobile</h3><button type="button" class="bp-vx-x" data-vx-close aria-label="Close (Esc)">Esc ✕</button></div>
    <div class="bp-vx-body">
      <figure class="bp-vx-qr"><div data-vx-qr></div><figcaption>Scan with your phone camera<br><a data-vx-link rel="noopener"><span data-vx-url></span></a></figcaption></figure>
      <form class="bp-vx-form" novalidate>

        <div class="bp-vx-phone"><span aria-hidden="true">+91</span><input id="bp-vx-mobile" name="mobile" type="tel" inputmode="numeric" autocomplete="tel-national" maxlength="16" placeholder="10-digit mobile number" aria-describedby="bp-vx-hint"></div>
        <p id="bp-vx-hint" class="bp-vx-hint" data-vx-hint aria-live="polite">Indian mobile: 10 digits starting with 6, 7, 8 or 9.</p>
        <button type="submit" class="bp-vx-send">Send Link on WhatsApp</button>
        <p class="bp-vx-status" data-vx-status role="status"></p>
        <p class="bp-vx-note">Free: WhatsApp opens with the message typed in; nothing is sent until you press Send there.</p>
      </form>
    </div>
  </dialog>
</section>
<style>
  /* Navy #08172f and metallic gold #d8b25a, as on the BizPulse website. Every rule is scoped to .bp-vx. */
  .bp-vx-open, .bp-vx-send { background: #d8b25a; color: #08172f; border: 0; border-radius: 6px; padding: 10px 18px; font: inherit; font-weight: 700; cursor: pointer; }
  .bp-vx-open:focus-visible, .bp-vx-send:focus-visible, .bp-vx-x:focus-visible { outline: 2px solid #ffffff; outline-offset: 2px; }
  .bp-vx-dialog { width: min(620px, calc(100vw - 24px)); padding: 0; border: 2px solid #d8b25a; border-radius: 10px; background: #0d2140; color: #e9f0f9; }
  .bp-vx-dialog::backdrop { background: rgba(8, 23, 47, 0.7); }
  .bp-vx-head { display: flex; justify-content: space-between; align-items: center; background: #08172f; padding: 10px 16px; }
  .bp-vx-head h3 { margin: 0; font-size: 1.1rem; color: #ffffff; }
  .bp-vx-x { background: transparent; color: #d8b25a; border: 1px solid #d8b25a; border-radius: 4px; padding: 3px 8px; cursor: pointer; font: inherit; font-size: 0.85rem; }
  .bp-vx-body { display: grid; grid-template-columns: auto 1fr; gap: 20px; padding: 18px; }
  @media (max-width: 560px) { .bp-vx-body { grid-template-columns: 1fr; justify-items: center; } }
  .bp-vx-qr { margin: 0; text-align: center; font-size: 0.85rem; color: #a9bdd6; }
  .bp-vx-qr [data-vx-qr] { background: #ffffff; padding: 4px; border-radius: 6px; line-height: 0; display: inline-block; }
  .bp-vx-qr svg { width: 190px; height: 190px; image-rendering: pixelated; }
  .bp-vx-qr a { color: #d8b25a; word-break: break-all; }
  .bp-vx-form { display: grid; gap: 8px; align-content: start; min-width: 0; }
  .bp-vx-form label { color: #cfdcec; font-weight: 600; }
  .bp-vx-phone { display: flex; border: 1px solid #2b4f7e; border-radius: 6px; overflow: hidden; background: #08172f; }
  .bp-vx-phone:focus-within { border-color: #d8b25a; outline: 2px solid #d8b25a; }
  .bp-vx-phone span { padding: 10px; background: #13294a; color: #d8b25a; font-weight: 700; }
  .bp-vx-phone input { flex: 1; min-width: 0; border: 0; background: transparent; color: #ffffff; padding: 10px; font: inherit; font-size: 1.05rem; letter-spacing: 0.5px; }
  .bp-vx-phone input:focus { outline: none; }
  .bp-vx-phone:has(input[aria-invalid="true"]) { border-color: #e07a6a; }
  .bp-vx-hint { margin: 0; font-size: 0.82rem; color: #8ea6c4; }
  .bp-vx-hint.bad { color: #ffb4a8; }
  .bp-vx-status:empty { display: none; }
  .bp-vx-status { margin: 0; padding: 8px 10px; border-left: 3px solid #d8b25a; background: #08172f; font-size: 0.88rem; }
  .bp-vx-note { margin: 0; font-size: 0.8rem; color: #8ea6c4; }
</style>
