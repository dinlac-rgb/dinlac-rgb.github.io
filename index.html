<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Srijee Creations | BizPulse Workspace Portal</title>
    <!-- Importing a premium high-contrast cursive font mimicking the Beatric luxury studio movements -->
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0a192f;
            --card-bg: #112240;
            --accent-blue: #00bcd4;
            --light-blue: #64ffda;
            --contrast-gold: #ffd700;
            --text-main: #e2e8f0;
            --text-dark: #8892b0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 13.5px;
            font-weight: normal;
            min-height: 100vh; 
            overflow-x: hidden; 
        }

        /* Central Gated Authentication Shell Container Layout */
        #auth-gate {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-color); display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 9999;
        }
        .auth-container {
            background: var(--card-bg); padding: 40px; border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; max-width: 420px; width: 90%;
            border: 1px solid rgba(0, 188, 212, 0.1);
        }
        
        .logo-text-display {
            font-size: 32px; 
            font-weight: 800; 
            color: #ffffff; 
            letter-spacing: 1px; 
            margin-bottom: 5px;
            text-transform: uppercase;
        }
        
        /* Thin luxury tagline styled directly to reflect the Beatric Font curves (no text-transform override) */
        .script-tagline {
            font-family: 'Playball', cursive; 
            font-size: 15px; 
            font-weight: 300; 
            color: var(--contrast-gold);
            margin-bottom: 25px; 
            display: block;
            letter-spacing: 1px;
        }
        
        .auth-panel { display: none; }
        .auth-panel.active { display: block; }
        
        .auth-container h3 { font-size: 13px; color: var(--accent-blue); margin-bottom: 15px; text-transform: uppercase; letter-spacing: 0.5px; }
        .auth-container input {
            width: 100%; padding: 11px; margin-bottom: 12px; border-radius: 4px;
            border: 1px solid var(--text-dark); background: var(--bg-color); color: white;
            font-size: 13px;
        }
        .auth-container button {
            background: var(--accent-blue); color: var(--bg-color); border: none;
            padding: 11px 24px; font-weight: bold; border-radius: 4px; cursor: pointer; width: 100%;
            font-size: 13px; margin-top: 5px; transition: 0.2s;
        }
        .auth-container button:hover { background: var(--light-blue); }
        
        .auth-nav-links { margin-top: 15px; font-size: 12px; color: var(--text-dark); }
        .auth-nav-links a { color: var(--accent-blue); text-decoration: none; cursor: pointer; margin: 0 5px; }
        .auth-nav-links a:hover { text-decoration: underline; }
        .alert-msg { font-size: 12px; margin-top: 10px; display: none; font-weight: 500; }

        /* Core Application Environment Main Shell */
        #main-site { display: none; }
        
        header { 
            background: var(--card-bg); border-bottom: 1px solid rgba(0,188,212,0.2); 
            position: sticky; top: 0; z-index: 100; padding: 15px 40px;
        }
        .nav-container { display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: 0 auto; }
        .main-brand-title { font-size: 24px; font-weight: 800; color: #ffffff; letter-spacing: 0.5px; }
        
        nav ul { display: flex; list-style: none; gap: 20px; }
        nav ul li a { 
            color: var(--text-main); text-decoration: none; font-size: 13px; font-weight: 500;
            padding: 8px 12px; border-radius: 4px; cursor: pointer;
        }
        nav ul li a:hover, nav ul li a.active { background: rgba(0,188,212,0.15); color: var(--accent-blue); }

        .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        .page-section { display: none; min-height: 70vh; }
        .page-section.active { display: block; }
        
        h2 { font-size: 24px; color: var(--accent-blue); margin-bottom: 20px; border-bottom: 2px solid var(--card-bg); padding-bottom: 8px; }
        p { font-size: 13.5px; line-height: 1.6; color: var(--text-main); }
        
        .shortcut-txt { font-weight: normal; }
        .shortcut-txt text { font-weight: bold; color: var(--light-blue); }

        /* Animation Feature Hub Canvas Section */
        .animation-showcase {
            background: var(--card-bg); border: 1px solid rgba(0, 188, 212, 0.1);
            border-radius: 8px; padding: 30px; margin-top: 30px;
        }
        .version-selector-row { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 15px; }
        .ver-btn {
            background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-dark); padding: 8px 16px; font-size: 12px; border-radius: 4px; cursor: pointer;
        }
        .ver-btn.active { background: rgba(0, 188, 212, 0.1); border-color: var(--accent-blue); color: var(--accent-blue); }
        .animation-display-box {
            background: #071224; border-radius: 6px; height: 140px;
            display: flex; align-items: center; justify-content: center; overflow: hidden;
        }
        
        /* Interactive Animation Wave Parameters */
        .voice-wave { display: flex; align-items: center; gap: 4px; }
        .bar { width: 4px; height: 15px; background: var(--accent-blue); border-radius: 2px; animation: pulse 0.6s ease-in-out infinite alternate; }
        .bar:nth-child(2) { animation-delay: 0.15s; height: 32px; }
        .bar:nth-child(3) { animation-delay: 0.3s; height: 18px; }
        .bar:nth-child(4) { animation-delay: 0.45s; height: 38px; }
        @keyframes pulse { from { transform: scaleY(0.5); } to { transform: scaleY(1.3); } }

        .ticker-stream { text-align: center; animation: scrollText 2.5s linear infinite; font-family: monospace; color: var(--light-blue); font-size: 12px; }
        @keyframes scrollText { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(-30px); opacity: 1; } }

        .scale-box { font-size: 36px; animation: tilt 1.5s ease-in-out infinite alternate; }
        @keyframes tilt { from { transform: rotate(-12deg); } to { transform: rotate(12deg); } }

        .sync-ring { width: 35px; height: 35px; border: 3px dashed var(--accent-blue); border-radius: 50%; animation: spin 3s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        .matrix-flash { width: 45px; height: 45px; border: 2px solid var(--contrast-gold); background: rgba(255, 215, 0, 0.05); animation: flash 1.2s ease-in-out infinite alternate; }
        @keyframes flash { from { opacity: 0.3; transform: scale(0.9); } to { opacity: 1; transform: scale(1.1); } }

        footer { text-align: center; padding: 30px; margin-top: 60px; color: var(--text-dark); font-size: 12px; border-top: 1px solid var(--card-bg); }
    </style>
</head>
<body>

    <!-- Centralized Multi-Form Authentication Gateway -->
    <div id="auth-gate">
        <div class="auth-container">
            <div class="logo-text-display">BIZPULSE</div>
            <!-- Rendered in elegant, natural thin cursive mimicking your image -->
            <div class="script-tagline">A Creation of Srijee Creations</div>

            <!-- Form 1: Master Access Login -->
            <div id="panel-login" class="auth-panel active">
                <h3>Workspace Access</h3>
                <input type="password" id="gate-pass" placeholder="Enter Authorization Passcode">
                <button onclick="handleLogin()">Authorize Workspace Access</button>
                <div id="login-error" class="alert-msg" style="color: #ff5252;">Invalid Passcode. Access Denied.</div>
                <div class="auth-nav-links">
                    New User? <a onclick="switchAuthPanel('signup')">Sign Up Workspace</a> | <a onclick="switchAuthPanel('recovery')">Change Password</a>
                </div>
            </div>

            <!-- Form 2: Sign-Up Interface Form Panel -->
            <div id="panel-signup" class="auth-panel">
                <h3>Register Workspace Account</h3>
                <input type="text" id="su-user" placeholder="Create Unique Username">
                <input type="email" id="su-email" placeholder="Associated Professional Email Address">
                <input type="password" id="su-pass" placeholder="Establish Secure Password">
                <button onclick="handleSignUp()">Create System Account</button>
                <div id="signup-status" class="alert-msg"></div>
                <div class="auth-nav-links">
                    Already Registered? <a onclick="switchAuthPanel('login')">Return to Log In</a>
                </div>
            </div>

            <!-- Form 3: Password Reset/Change Recovery Form Panel -->
            <div id="panel-recovery" class="auth-panel">
                <h3>Modify Account Password</h3>
                <input type="text" id="pc-user" placeholder="Confirm Workspace Username">
                <input type="password" id="pc-old" placeholder="Provide Current Active Password">
