<!DOCTYPE html>
<html lang="en-IN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BizPulse | Home</title>
<meta name="description" content="BizPulse by Srijee Creations: GST-ready accounting software for Indian businesses, from mobile billing to full CA practice suites.">
<meta name="theme-color" content="#08172f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playball&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #08172f;
    --bg-2: #0c2142;
    --surface: #10284d;
    --surface-2: #143059;
    --border: #1f3d6b;
    --border-strong: #2c5290;
    --text: #e9eef7;
    --muted: #9fb0cc;
    --white: #ffffff;
    --neon: #38c9ff;
    --neon-deep: #1798d6;
    --gold: #d8b25a;
    --gold-soft: #e9cf8e;
    --gold-deep: #b98a2c;
    --success: #43d29a;
    --radius: 12px;
    --radius-sm: 8px;
    --shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
    --font-ui: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
    --text-size: 15px;
  }

  *, *::before, *::after { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: var(--font-ui);
    font-size: var(--text-size);
    line-height: 1.55;
    color: var(--text);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
  }

  a { color: var(--neon); text-decoration: none; }
  a:hover { text-decoration: underline; }

  h2, h3, h4 { margin: 0; font-weight: 600; line-height: 1.25; }
  p { margin: 0; }

  button { font: inherit; color: inherit; }

  :focus-visible { outline: 2px solid var(--neon); outline-offset: 2px; }

  /* ---------- Brand (shared by splash and header) ---------- */
  .logo {
    margin: 0;
    font-family: var(--font-ui);
    font-size: 32px;
    font-weight: 800;
    letter-spacing: 1px;
    line-height: 1.1;
    color: var(--white);
  }
  .tagline {
    margin: 4px 0 0;
    padding: 0;
    font-family: "Playball", cursive;
    font-size: calc(var(--text-size) - 2pt);
    font-weight: 300;
    font-style: normal;
    text-transform: none;
    letter-spacing: normal;
    line-height: 1.35;
    color: var(--gold);
    background: none;
    border: 0;
  }

  /* ---------- Splash ---------- */
  .splash {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: grid;
    place-items: center;
    padding: 16px;
    background: var(--bg);
    animation: splash-out 450ms ease 2s forwards;
  }
  .splash-box {
    width: min(400px, 100%);
    padding: 34px 32px 28px;
    text-align: center;
    background: var(--bg-2);
    border: 1px solid var(--border-strong);
    border-radius: 0;
    box-shadow: var(--shadow);
  }
  .splash-progress {
    margin-top: 24px;
    height: 4px;
    background: #17325c;
    overflow: hidden;
  }
  .splash-progress span {
    display: block;
    height: 100%;
    background: var(--neon);
    transform: scaleX(0);
    transform-origin: left center;
    animation: splash-fill 2s linear forwards;
  }
  @keyframes splash-fill { to { transform: scaleX(1); } }
  @keyframes splash-out { to { opacity: 0; visibility: hidden; } }

  /* ---------- Header ---------- */
  .site-header {
    background: var(--bg-2);
    border-bottom: 1px solid var(--border);
  }
  .header-inner {
    max-width: 1200px;
    margin: 0 auto;
    padding: 18px 16px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  .brand a { color: inherit; text-decoration: none; }
  .brand { display: inline-flex; flex-direction: column; align-items: flex-start; }
  .brand-line {
    position: relative;
    display: block;
    width: 100%;
    height: 2px;
    margin-top: 8px;
    border-radius: 2px;
    background: rgba(56, 201, 255, 0.18);
    overflow: hidden;
  }
  .brand-line::after {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 40%;
    height: 100%;
    border-radius: 2px;
    background: linear-gradient(90deg, transparent, var(--neon), var(--gold), transparent);
    animation: brand-sweep 3.2s ease-in-out infinite;
  }
  @keyframes brand-sweep {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(250%); }
  }
  @media (prefers-reduced-motion: reduce) {
    .brand-line::after { animation: none; width: 100%; opacity: 0.6; }
  }
  .support-badge {
    padding: 5px 12px;
    font-size: 12.5px;
    color: var(--muted);
    border: 1px solid var(--border-strong);
    border-radius: 999px;
    white-space: nowrap;
  }

  .tabbar {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 16px;
    display: flex;
    gap: 4px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .tabbar::-webkit-scrollbar { display: none; }
  .tab {
    flex: 0 0 auto;
    padding: 12px 14px 11px;
    background: none;
    border: 0;
    border-bottom: 2px solid transparent;
    color: var(--muted);
    font-size: 14px;
    cursor: pointer;
    white-space: nowrap;
    transition: color 150ms, border-color 150ms;
  }
  .tab:hover { color: var(--text); }
  .tab[aria-selected="true"] { color: var(--white); border-bottom-color: var(--neon); }

  /* ---------- Pages ---------- */
  .page {
    max-width: 1200px;
    margin: 0 auto;
    padding: 36px 16px 64px;
  }
  .page[hidden] { display: none; }
  .page.is-entering { animation: page-in 220ms ease-out; }
  @keyframes page-in {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: none; }
  }

  .page-head { margin-bottom: 28px; max-width: 760px; }
  .eyebrow {
    margin-bottom: 8px;
    font-size: 12px;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: var(--gold);
  }
  .page-head h2 { font-size: calc(26px - 2pt); margin-bottom: 10px; }
  .page-head p { color: var(--muted); }

  .section-title {
    margin: 36px 0 14px;
    padding-bottom: 8px;
    font-size: 17px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 8px;
  }
  .section-title span { font-size: 12.5px; font-weight: 400; color: var(--muted); }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px;
  }
  .card h3 { font-size: 17px; margin-bottom: 8px; }
  .card p { color: var(--muted); font-size: 14px; }
  .card p + p { margin-top: 8px; }

  .grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
  .grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 10px 18px;
    border: 1px solid transparent;
    border-radius: var(--radius-sm);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
    transition: filter 150ms, border-color 150ms, background 150ms;
  }
  .btn:hover { text-decoration: none; }
  .btn-primary { background: linear-gradient(180deg, var(--neon), var(--neon-deep)); color: #04121c; }
  .btn-primary:hover { filter: brightness(1.08); }
  .btn-outline { background: transparent; border-color: var(--border-strong); color: var(--text); }
  .btn-outline:hover { border-color: var(--neon); }
  .btn-gold { background: linear-gradient(180deg, var(--gold-soft), var(--gold-deep)); color: #2a1c03; }
  .btn-gold:hover { filter: brightness(1.06); }
  .btn.is-disabled { opacity: 0.55; cursor: not-allowed; pointer-events: none; }

  .actions { margin-top: 24px; display: flex; gap: 12px; flex-wrap: wrap; }

  /* ---------- Home ---------- */
  .hero {
    padding: 30px;
    margin-bottom: 20px;
    background: linear-gradient(135deg, var(--surface-2), var(--bg-2));
    border: 1px solid var(--border);
    border-radius: var(--radius);
  }
  .hero h2 { font-size: calc(28px - 2pt); margin-bottom: 12px; max-width: 720px; }
  .hero p { color: var(--muted); max-width: 720px; }
  
  /* ---------- Feature Animation Visualizer Showcase ---------- */
  .animation-showcase {
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    margin-top: 24px;
  }
  .version-selector-row {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    padding-bottom: 14px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .version-selector-row::-webkit-scrollbar { display: none; }
  .ver-btn {
    background: rgba(255, 255, 255, 0.02);
    border: 1px solid var(--border-strong);
    color: var(--muted);
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 600;
    border-radius: var(--radius-sm);
    cursor: pointer;
    white-space: nowrap;
    transition: all 150ms;
  }
  .ver-btn:hover { color: var(--text); border-color: var(--muted); }
  .ver-btn.active {
    background: rgba(56, 201, 255, 0.12);
    border-color: var(--neon);
    color: var(--neon);
  }
  .animation-display-box {
    background: #051024;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    height: 150px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  
  /* Animation Layout States */
  .voice-wave { display: flex; align-items: center; gap: 4px; }
  .voice-bar {
    width: 4px;
    height: 16px;
    background: var(--neon);
    border-radius: 2px;
    animation: wave-pulse 0.6s ease-in-out infinite alternate;
  }
  .voice-bar:nth-child(2) { animation-delay: 0.15s; height: 36px; }
  .voice-bar:nth-child(3) { animation-delay: 0.3s; height: 22px; }
  .voice-bar:nth-child(4) { animation-delay: 0.45s; height: 42px; }
  @keyframes wave-pulse { from { transform: scaleY(0.4); } to { transform: scaleY(1.2); } }
